services:
  db:
    image: postgres:18

    environment:
      POSTGRES_DB: smartwallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d smartwallet" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://db:5432/smartwallet
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}

    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./Frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
